<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grow a Garden Fruit Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="custom-bg">
  <div class="container">
    <h1 class="title">GODZBLOXX</h1>
    <div class="products" id="products">
      <!-- Product cards will be here -->
      <div class="product-card" data-product="Fruit 100RB">
        <span style="font-size: 5rem;">🍎</span>
        <h2>Fruit 100RB</h2>
        <p class="price">Rp1.000 for 100RB Fruit</p>
        <button class="buy-btn">Beli Sekarang</button>
      </div>
      <div class="product-card" data-product="Fruit 200RB">
        <span style="font-size: 5rem;">🍊</span>
        <h2>Fruit 200RB</h2>
        <p class="price">Rp2.000 for 200RB Fruit</p>
        <button class="buy-btn">Beli Sekarang</button>
      </div>
      <div class="product-card" data-product="Fruit 500RB">
        <span style="font-size: 5rem;">🍇</span>
        <h2>Fruit 500RB</h2>
        <p class="price">Rp5.000 for 500RB Fruit</p>
        <button class="buy-btn">Beli Sekarang</button>
      </div>
      <div class="product-card" data-product="Fruit 1JT">
        <span style="font-size: 5rem;">🍉</span>
        <h2>Fruit 1JT</h2>
        <p class="price">Rp10 .000 for 1JT Fruit</p>
        <button class="buy-btn">Beli Sekarang</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
